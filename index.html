<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta FLV - Rutas y Despliegue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 450px;
      width: 100%;
      border-top: 6px solid #b71c1c;
    }
    .titulo { text-align: center; color: #2c3e50; margin-top: 0; font-weight: 700; letter-spacing: 0.5px; }
    .subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
    .input-dni {
      padding: 14px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 6px;
      text-align: center; outline: none; font-weight: bold; letter-spacing: 2px;
      color: #333; transition: border-color 0.3s;
    }
    .input-dni:focus { border-color: #b71c1c; }
    .btn-consultar {
      padding: 15px; font-size: 16px; background: #b71c1c; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; transition: background 0.3s;
    }
    .btn-consultar:hover { background: #901616; }
    .btn-volver {
      margin-top: 20px; padding: 12px; width: 100%; font-size: 14px; background: white;
      color: #b71c1c; border: 2px solid #b71c1c; border-radius: 6px; cursor: pointer;
      font-weight: bold; transition: all 0.3s; display: block; text-transform: uppercase;
    }
    .btn-volver:hover { background: #fef2f2; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="tarjeta">
    
    <div id="pantalla-busqueda">
      <h2 class="titulo">Consulta FLV</h2>
      <p class="subtitulo">Ingrese el número de DNI</p>
      
      <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
        <input type="number" id="dni" class="input-dni" placeholder="Ej: 12345678" oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);">
        <button onclick="consultar()" class="btn-consultar">Consultar</button>
      </div>
    </div>
    
    <div id="resultados"></div>
    
  </div>

  <script>
    // Se agregó .replace(/[¿?]/g, "") para que ignore los signos de interrogación al buscar columnas
    function normalizar(texto) {
      return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[¿?]/g, "").trim();
    }

    function obtenerDato(fila, nombreColumnaBuscada) {
      if(!fila) return "No registrado";
      const llave = Object.keys(fila).find(k => normalizar(k) === normalizar(nombreColumnaBuscada));
      return llave && fila[llave] !== null && fila[llave] !== "" ? fila[llave] : "No registrado";
    }

    function consultar() {
      const dniIngresado = document.getElementById("dni").value.trim();
      const resultadosDiv = document.getElementById("resultados");
      const pantallaBusqueda = document.getElementById("pantalla-busqueda");
      
      if(dniIngresado.length !== 8) {
        resultadosDiv.innerHTML = "<p style='color:#b71c1c; text-align:center; font-weight:bold; background: #fee2e2; padding: 10px; border-radius: 6px;'>El DNI debe tener exactamente 8 dígitos.</p>";
        return;
      }

      resultadosDiv.innerHTML = "<p style='text-align:center; color: #475569; font-weight:bold;'>Verificando Identidad (Hoja SIPE)...</p>";

      // ==============================================================
      // ¡NO OLVIDES PONER TU ENLACE BASE DE SHEETDB AQUÍ ABAJO!
      // ==============================================================
      const miUrlSheetDB = "https://sheetdb.io/api/v1/5r3h4jnifdyj9";

      fetch(miUrlSheetDB + "?sheet=SIPE")
        .then(respuesta => respuesta.json())
        .then(datosSipe => {
          
          if(!Array.isArray(datosSipe)) {
            resultadosDiv.innerHTML = "<p style='color:#b71c1c; text-align:center;'>Error: Verifica que la pestaña en Google Sheets se llame 'SIPE'.</p>";
            return;
          }

          let personaEncontrada = null;
          for (let i = 0; i < datosSipe.length; i++) {
            let dniFila = obtenerDato(datosSipe[i], "DNI"); 
            if (String(dniFila).trim() === String(dniIngresado).trim()) {
              personaEncontrada = datosSipe[i];
              break; 
            }
          }

          if (!personaEncontrada) {
            resultadosDiv.innerHTML = `
              <div style='background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px;'>
                <h4 style='margin-top:0; color: #991b1b;'>❌ Sin resultados</h4>
                <p style='color: #7f1d1d; font-size: 14px; margin-bottom: 0;'>El DNI <b>${dniIngresado}</b> no registra información.</p>
              </div>`;
            return; 
          }

          pantallaBusqueda.style.display = "none";
          resultadosDiv.innerHTML = "<p style='text-align:center; color: #475569; font-weight:bold;'>Extrayendo información de ruta (Hoja DATOS)...</p>";

          let idLocalSipe = obtenerDato(personaEncontrada, "ID LOCAL");

          fetch(miUrlSheetDB + "?sheet=DATOS")
            .then(respuesta => respuesta.json())
            .then(datosRuta => {
              
              let infoRuta = null;
              if(Array.isArray(datosRuta)) {
                for (let j = 0; j < datosRuta.length; j++) {
                  let codigoLV = obtenerDato(datosRuta[j], "CODIGO DE LV");
                  if (codigoLV !== "No registrado" && codigoLV == idLocalSipe) {
                    infoRuta = datosRuta[j];
                    break;
                  }
                }
              }
              
              // Cabecera
              const nombre = obtenerDato(personaEncontrada, "nombre completo");
              const celular = obtenerDato(personaEncontrada, "celular");
              
              // Lógica de ¿Es Responsable?
              const esResponsable = obtenerDato(personaEncontrada, "es responsable");
              let badgeResponsable = "";
              if (esResponsable.toUpperCase() === "SI" || esResponsable.toUpperCase() === "SÍ") {
                badgeResponsable = `<span style="background: #fef08a; color: #854d0e; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; vertical-align: text-bottom; font-weight: bold;">⭐ RESPONSABLE</span>`;
              } else if (esResponsable.toUpperCase() === "NO") {
                badgeResponsable = `<span style="background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; vertical-align: text-bottom; font-weight: bold;">Apoyo</span>`;
              } else if (esResponsable !== "No registrado") {
                badgeResponsable = `<span style="background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-left: 5px; vertical-align: text-bottom; font-weight: bold;">${esResponsable}</span>`;
              }
              
              // Lugar Asignado
              const departamento = obtenerDato(personaEncontrada, "departamento");
              const provincia = obtenerDato(personaEncontrada, "provincia");
              const distrito = obtenerDato(personaEncontrada, "distrito");
              const localVotacion = obtenerDato(personaEncontrada, "local de votacion");
              const centroPoblado = obtenerDato(infoRuta, "centro poblado");
              let direccion = obtenerDato(infoRuta, "direccion del local de votacion");
              if(direccion === "No registrado") direccion = obtenerDato(infoRuta, "direccion");

              // Ocultar Centro Poblado si no hay datos
              let htmlCentroPoblado = "";
              if (centroPoblado !== "No registrado" && centroPoblado.trim() !== "") {
                htmlCentroPoblado = `<p style="margin: 0;"><b>Centro Poblado:</b> ${centroPoblado}</p>`;
              }

              // Rutas
              const numRuta = obtenerDato(infoRuta, "numero de ruta");
              const descRuta = obtenerDato(infoRuta, "descripcion de ruta");
              const tipoMovilidad = obtenerDato(infoRuta, "tipo de movilidad");
              const fechaPartida = obtenerDato(infoRuta, "fecha de partida");
              const horaPartida = obtenerDato(infoRuta, "hora de partida");
              const fechaLlegada = obtenerDato(infoRuta, "fecha de llegada");
              const horaLlegada = obtenerDato(infoRuta, "hora de llegada");

              resultadosDiv.innerHTML = `
                <div style="text-align: center; animation: fadeIn 0.6s ease-in;">
                  
                  <h2 style="color: #b71c1c; margin-bottom: 5px; font-size: 24px;">Bienvenido FLV</h2>
                  <h3 style="color: #1e293b; margin-top: 0; margin-bottom: 5px; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap;">
                    ${nombre} ${badgeResponsable}
                  </h3>
                  <p style="color: #64748b; font-size: 15px; margin-top: 0; margin-bottom: 25px; letter-spacing: 1px; font-weight: bold;">
                    DNI: ${dniIngresado} &nbsp;|&nbsp; 📱 ${celular}
                  </p>

                  <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-left: 5px solid #166534; padding: 20px; border-radius: 8px; text-align: left; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
                    <h4 style="color: #166534; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #bbf7d0; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">📍 LUGAR ASIGNADO</h4>
                    <div style="line-height: 1.8; color: #166534; font-size: 14.5px;">
                      <p style="margin: 0;"><b>Departamento:</b> ${departamento}</p>
                      <p style="margin: 0;"><b>Provincia:</b> ${provincia}</p>
                      <p style="margin: 0;"><b>Distrito:</b> ${distrito}</p>
                      ${htmlCentroPoblado}
                      <p style="margin: 0;"><b>Local de Votación:</b> ${localVotacion}</p>
                      <p style="margin: 0;"><b>Dirección:</b> ${direccion}</p>
                    </div>
                  </div>

                  <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-left: 5px solid #1e3a8a; padding: 20px; border-radius: 8px; text-align: left; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
                    <h4 style="color: #1e3a8a; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #bfdbfe; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">🚌 INFORMACIÓN DE RUTA</h4>
                    
                    <div style="line-height: 1.8; color: #1e3a8a; font-size: 14.5px; margin-bottom: 15px;">
                      <p style="margin: 0;"><b>Número de Ruta:</b> ${numRuta}</p>
                      <p style="margin: 0;"><b>Descripción:</b> ${descRuta}</p>
                      <p style="margin: 0;"><b>Tipo de Movilidad:</b> <span style="background:#dbeafe; padding: 3px 8px; border-radius:4px; font-weight:bold;">${tipoMovilidad}</span></p>
                    </div>

                    <!-- NUEVO TÍTULO "DESPLIEGUE" -->
                    <h5 style="color: #1e3a8a; margin: 20px 0 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #bfdbfe; padding-bottom: 5px;">🚀 Despliegue</h5>

                    <div style="display: flex; gap: 10px;">
                      <div style="flex: 1; background: white; padding: 12px; border-radius: 6px; border: 1px solid #bfdbfe; text-align: center;">
                        <p style="margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;">Salida</p>
                        <p style="margin: 5px 0 0 0; font-weight: bold; color: #0f172a; font-size: 14px;">📅 ${fechaPartida}</p>
                        <p style="margin: 0; color: #0f172a; font-size: 13px;">⏰ ${horaPartida}</p>
                      </div>
                      <div style="flex: 1; background: white; padding: 12px; border-radius: 6px; border: 1px solid #bfdbfe; text-align: center;">
                        <p style="margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;">Llegada</p>
                        <p style="margin: 5px 0 0 0; font-weight: bold; color: #0f172a; font-size: 14px;">📅 ${fechaLlegada}</p>
                        <p style="margin: 0; color: #0f172a; font-size: 13px;">⏰ ${horaLlegada}</p>
                      </div>
                    </div>
                  </div>

                  <button onclick="location.reload()" class="btn-volver">Realizar otra consulta</button>
                  
                </div>
              `;
            })
            .catch(error => {
              resultadosDiv.innerHTML = "<p style='color:#b71c1c; text-align:center;'>Error conectando con la pestaña DATOS.</p>";
            });
        })
        .catch(error => {
          resultadosDiv.innerHTML = "<p style='color:#b71c1c; text-align:center; background: #fee2e2; padding: 10px; border-radius: 6px;'>Error de conexión. Revisa el enlace de SheetDB.</p>";
        });
    }
  </script>
</body>
</html>
