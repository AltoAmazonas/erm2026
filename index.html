<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación de Identidad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ================================================= */
    /* OCULTAR FLECHAS DE SUBIR Y BAJAR EN EL CAMPO DNI  */
    /* ================================================= */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield; /* Soporte para Firefox */
    }

    /* Estilos institucionales */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
      border-top: 6px solid #b71c1c; /* Rojo Institucional */
    }
    .titulo {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .input-dni {
      padding: 14px;
      font-size: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      text-align: center;
      outline: none;
      font-weight: bold;
      letter-spacing: 2px;
      color: #333;
      transition: border-color 0.3s;
    }
    .input-dni:focus {
      border-color: #b71c1c;
    }
    .btn-consultar {
      padding: 15px;
      font-size: 16px;
      background: #b71c1c; /* Rojo Institucional */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.3s;
    }
    .btn-consultar:hover {
      background: #901616; /* Rojo más oscuro al pasar el mouse */
    }
  </style>
</head>
<body>

  <div class="tarjeta">
    
    <!-- TEXTOS ACTUALIZADOS -->
    <h2 class="titulo">Consulta FLV</h2>
    <p class="subtitulo">Ingrese el número de DNI</p>
    
    <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
      <!-- CAMPO TIPO NÚMERO (Sin flechas y con límite exacto de 8 dígitos) -->
      <input type="number" id="dni" class="input-dni" placeholder="Ej: 12345678" oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);">
      
      <!-- BOTÓN ACTUALIZADO -->
      <button onclick="consultar()" class="btn-consultar">Consultar</button>
    </div>
    
    <div id="resultados"></div>
    
  </div>

  <script>
    function normalizar(texto) {
      return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function obtenerDato(fila, nombreColumnaBuscada) {
      const llave = Object.keys(fila).find(k => normalizar(k) === normalizar(nombreColumnaBuscada));
      return llave && fila[llave] !== null && fila[llave] !== "" ? fila[llave] : "No registrado";
    }

    function consultar() {
      const dniIngresado = document.getElementById("dni").value.trim();
      const resultadosDiv = document.getElementById("resultados");
      
      if(dniIngresado.length !== 8) {
        resultadosDiv.innerHTML = "<p style='color:#b71c1c; text-align:center; font-weight:bold; background: #fee2e2; padding: 10px; border-radius: 6px;'>El DNI debe tener exactamente 8 dígitos.</p>";
        return;
      }

      resultadosDiv.innerHTML = "<p style='text-align:center; color: #475569; font-weight:bold;'>Conectando con la base de datos...</p>";

      // ==============================================================
      // ¡NO OLVIDES PONER TU ENLACE DE SHEETDB AQUÍ ABAJO!
      // ==============================================================
      const miUrlSheetDB = "https://sheetdb.io/api/v1/entbyg0kw2hdw";

      fetch(miUrlSheetDB)
        .then(respuesta => respuesta.json())
        .then(datos => {
          resultadosDiv.innerHTML = "";
          let personaEncontrada = null;

          for (let i = 0; i < datos.length; i++) {
            let dniFila = obtenerDato(datos[i], "DNI"); 
            if (String(dniFila).trim() === String(dniIngresado).trim()) {
              personaEncontrada = datos[i];
              break; 
            }
          }

          if (personaEncontrada) {
            const nombre = obtenerDato(personaEncontrada, "nombre completo");
            const celular = obtenerDato(personaEncontrada, "celular");
            const departamento = obtenerDato(personaEncontrada, "departamento");
            let provincia = obtenerDato(personaEncontrada, "provincial");
            if (provincia === "No registrado") provincia = obtenerDato(personaEncontrada, "provincia");
            const distrito = obtenerDato(personaEncontrada, "distrito");
            const centroPoblado = obtenerDato(personaEncontrada, "centro poblado");
            const direccion = obtenerDato(personaEncontrada, "direccion");
            const tipoFlv = obtenerDato(personaEncontrada, "tipo flv");

            resultadosDiv.innerHTML = `
              <div style='background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 8px; font-size: 14px;'>
                <h3 style='margin-top:0; color: #166534; text-align: center; border-bottom: 1px solid #bbf7d0; padding-bottom: 10px;'>✅ Datos Encontrados</h3>
                <div style='line-height: 1.8; color: #334155;'>
                  <p style='margin: 0;'><b>Nombre:</b> ${nombre}</p>
                  <p style='margin: 0;'><b>Celular:</b> ${celular}</p>
                  <p style='margin: 0;'><b>Departamento:</b> ${departamento}</p>
                  <p style='margin: 0;'><b>Provincia:</b> ${provincia}</p>
                  <p style='margin: 0;'><b>Distrito:</b> ${distrito}</p>
                  <p style='margin: 0;'><b>C. Poblado:</b> ${centroPoblado}</p>
                  <p style='margin: 0;'><b>Dirección:</b> ${direccion}</p>
                  <p style='margin: 0;'><b>Tipo FLV:</b> <span style='background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 4px; font-weight: bold;'>${tipoFlv}</span></p>
                </div>
              </div>
            `;
          } else {
            resultadosDiv.innerHTML = `
              <div style='background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; text-align: center;'>
                <h4 style='margin-top:0; color: #991b1b;'>❌ Sin resultados</h4>
                <p style='color: #7f1d1d; font-size: 14px; margin-bottom: 0;'>El DNI <b>${dniIngresado}</b> no registra información.</p>
              </div>
            `;
          }
        })
        .catch(error => {
          resultadosDiv.innerHTML = "<p style='color:#b71c1c; text-align:center; background: #fee2e2; padding: 10px; border-radius: 6px;'>Error de conexión. Revisa el enlace de SheetDB.</p>";
        });
    }
  </script>
</body>
</html>
